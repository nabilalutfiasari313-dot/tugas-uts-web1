<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Toko Buku Online</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; text-align: center;">
    
    <!-- Logo di halaman Login -->
    <img src="img/logo.png" alt="Logo Toko Buku" style="width: 80px; height: auto; margin-bottom: 10px;">
    
    <h2 style="margin-bottom: 20px;">Login Pengguna</h2>
    
    <form id="loginForm" style="text-align: left;">
      <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" required placeholder="Masukkan email...">
      </div>
      <div class="form-group">
        <label>Password:</label>
        <input type="password" id="password" required placeholder="Masukkan password...">
      </div>
      <button type="submit" style="width: 100%;">Login</button>
    </form>
    
    <div style="margin-top: 20px;">
      <a href="#" id="btnLupa" style="color: var(--dark-pink); margin-right: 15px;">Lupa Password?</a>
      <a href="#" id="btnDaftar" style="color: var(--dark-pink);">Daftar Akun</a>
    </div>
  </div>

  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h3 id="modalTitle">Informasi</h3>
      <p id="modalText">Isi pesan modal...</p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
