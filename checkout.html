<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Halaman Pemesanan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h2>Formulir Pemesanan Buku</h2>
    <a href="dashboard.html" class="btn" style="margin-bottom: 15px;">&larr; Kembali ke Dashboard</a>
    
    <form id="checkoutForm">
      <div class="form-group">
        <label>Nama Pemesan:</label>
        <input type="text" id="namaPemesan" required placeholder="Nama lengkap...">
      </div>
      <div class="form-group">
        <label>Pilih Buku:</label>
        <select id="pilihBuku">
          <!-- Diisi otomatis dari data katalog -->
        </select>
      </div>
      <div class="form-group">
        <label>Jumlah Pesan:</label>
        <input type="text" id="jumlahPesan" value="1" required>
      </div>
      <div class="form-group">
        <label>Metode Pembayaran:</label>
        <select id="metodePembayaran">
          <option value="Transfer Bank">Transfer Bank</option>
          <option value="ShopeePay">ShopeePay / E-Wallet</option>
          <option value="COD">COD (Bayar di Tempat)</option>
        </select>
      </div>
      <button type="submit">Proses Pesanan</button>
    </form>
    
    <div id="outputCheckout" style="margin-top: 20px;"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
